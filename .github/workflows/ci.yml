name: CI
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - '*'

env:
  # Dev/lint/publish toolchain: newest stable. The test matrix below also covers
  # the oldest versions declared in mix.exs.
  ELIXIR_VERSION: "1.20.4"
  OTP_VERSION: "29.0.6"

jobs:
  mix_format:
    name: mix format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}
      - uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-
      - name: Install Dependencies
        run: mix deps.get
      - name: Run Formatter
        run: mix format --check-formatted

  mix_credo:
    name: mix credo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}
      - uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-
      - name: Install Dependencies
        run: mix deps.get
      - name: Run Credo
        run: mix credo

  mix_test:
    name: mix test (Elixir ${{ matrix.elixir }} OTP ${{ matrix.otp }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest supported, per `elixir: "~> 1.18"` in mix.exs
          - elixir: "1.18.5"
            otp: "27.3.4.17"
          - elixir: "1.19.6"
            otp: "28.5.0.5"
          # Newest, matches .tool-versions
          - elixir: "1.20.4"
            otp: "29.0.6"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          elixir-version: ${{ matrix.elixir }}
      - uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-${{ matrix.elixir }}-${{ matrix.otp }}-
      - name: Install Dependencies
        run: mix deps.get
      - name: Compile without warnings
        run: mix compile --warnings-as-errors
        env:
          MIX_ENV: test
      - name: Run Tests
        run: mix test

  mix_test_floor_deps:
    # mix.lock pins the newest release of every dep, so the matrix above never
    # exercises the *lowest* versions the constraints in mix.exs allow.
    name: mix test (lowest allowed deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27.3.4.17"
          elixir-version: "1.18.5"
      - name: Pin deps to the lowest allowed versions
        run: |
          set -euo pipefail
          sed -i 's/{:phoenix, ">= 1.8.9 and < 2.0.0"/{:phoenix, "== 1.8.9"/' mix.exs
          sed -i 's/{:plug, ">= 1.18.5 and < 2.0.0"/{:plug, "== 1.18.5"/' mix.exs
          # Fail loudly if the constraints in mix.exs changed and the seds no-oped,
          # which would silently turn this job into a duplicate of the matrix above.
          grep -q '{:phoenix, "== 1.8.9"' mix.exs
          grep -q '{:plug, "== 1.18.5"' mix.exs
          rm mix.lock
      - name: Install Dependencies
        run: mix deps.get
      - name: Run Tests
        run: mix test

  coverage:
    name: Check coverage
    runs-on: ubuntu-latest
    needs: [mix_format, mix_credo, mix_test]
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}
      - uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-
      - name: Install Dependencies
        run: mix deps.get
      - name: Run Mix Coverage
        run: mix coveralls.json
        env:
          MIX_ENV: test
      - name: Upload to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./cover/excoveralls.json
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  mix_check_version:
    name: Check version
    runs-on: ubuntu-latest
    needs: [mix_format, mix_credo, mix_test]
    if: github.ref != 'refs/heads/master' && github.event_name == 'pull_request' && github.base_ref == 'master'
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}
      - name: Install Dependencies
        run: mix deps.get
      - name: Check version
        run: mix run bin/check_version.exs

  mix_publish:
    name: Publish
    runs-on: ubuntu-latest
    needs: [mix_format, mix_credo, mix_test]
    outputs:
      version: ${{ steps.output_version.outputs.version }}
    if: github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}
      - name: Install Dependencies
        run: mix do deps.get, deps.compile, compile
      - name: Publish
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: mix hex.publish --yes
      - name: Output version
        id: output_version
        run: |
          echo "version=v$(mix run -e 'IO.puts(Application.spec(:xcribe, :vsn))')" >> "$GITHUB_OUTPUT"

  github_release:
    name: Create release
    runs-on: ubuntu-latest
    needs: [mix_publish]
    if: github.ref == 'refs/heads/master'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.mix_publish.outputs.version }}
          name: Release ${{ needs.mix_publish.outputs.version }}
          body: Checkout the [changelog](https://github.com/Finbits/xcribe/blob/master/CHANGELOG.md)
          draft: false
          prerelease: false
